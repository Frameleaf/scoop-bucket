name: Manifests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # ponytail: on schedule/dispatch, checkver -Update follows the latest Frameleaf Desktop release.
      FOLLOW_LATEST: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install, check and uninstall every manifest
        shell: pwsh
        run: |
          Invoke-RestMethod -Uri https://get.scoop.sh -OutFile install.ps1
          .\install.ps1 -RunAsAdmin
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          foreach ($manifest in Get-ChildItem bucket\*.json) {
            $app = $manifest.FullName
            & "$env:USERPROFILE\scoop\apps\scoop\current\bin\checkver.ps1" -App $manifest.BaseName -Dir bucket -Update:($env:FOLLOW_LATEST -eq 'true')
            scoop install $app
            if ($LASTEXITCODE) { throw "scoop install $app failed" }
            scoop uninstall $manifest.BaseName
            if ($LASTEXITCODE) { throw "scoop uninstall $app failed" }
          }
      - name: Commit the update
        if: env.FOLLOW_LATEST == 'true'
        shell: bash
        run: |
          git diff --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Update frameleaf to $(jq -r .version bucket/frameleaf.json)"
          git push origin HEAD:refs/heads/main
